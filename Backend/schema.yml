        calculation_version:
          type: string
        source_simulated:
          type: boolean
        reading_id:
          type: integer
          nullable: true
        period_start:
          type: string
          format: date-time
          nullable: true
        period_end:
          type: string
          format: date-time
          nullable: true
        reading_count:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - averaging_time
      - calculation_type
      - calculation_version
      - concentration_mg_m3
      - concentration_ppm
      - created_at
      - exposure_concentration_mg_m3
      - id
      - intake
      - interpretation
      - period_end
      - period_start
      - reading_count
      - reading_id
      - rfc
      - rq
      - source_simulated
      - worker_code
    ARKLResult:

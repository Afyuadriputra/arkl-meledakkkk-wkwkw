          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,6})?$
          nullable: true
        averaging_time:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
          nullable: true
        intake:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,12})?$
          nullable: true
        rfc:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,8})?$
        rq:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,12})?$
        interpretation:
